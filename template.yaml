# ==========================================
# Finance-RAG Zeabur 部署模板
#
# Template 负责：etcd / minio / milvus / postgres（4 个基础设施）
# Git 自动检测：backend（根目录 Dockerfile）+ frontend（frontend-react/Dockerfile）
#
# 部署步骤：
# 1. Zeabur → New Project → 用此 template.yaml 创建，自动拉起 4 个基础设施服务
# 2. Zeabur → New Service → Git → 选同一个仓库，自动构建 Backend (Dockerfile)
# 3. Zeabur → New Service → Git → 选同一个仓库，Root Directory 填 frontend-react
# 4. 在 Backend 服务的 Env 里填 DASHSCOPE_API_KEY
# 5. 完成
# ==========================================

apiVersion: zeabur.com/v1
kind: Template
metadata:
  name: finance-rag
spec:
  description: 智能金融投研 Agentic RAG 系统 — FastAPI + React + Milvus 自建 + Qwen
  tags:
    - AI
    - RAG
    - Finance
    - Milvus
  readme: |
    # 📈 Finance-RAG 智能金融投研系统

    基础设施已就绪（PostgreSQL + Milvus），接下来手动添加应用服务：

    ### 添加 Backend
    New Service → Git → 选择此仓库 → Zeabur 自动检测 Dockerfile 构建。
    构建完成后，在 Environment Variables 中填入：
    - `DASHSCOPE_API_KEY`: 阿里云百炼 API Key

    ### 添加 Frontend
    New Service → Git → 选择此仓库 → Root Directory 填 `frontend-react`。
    Build Args 中设 `VITE_API_KEY` 与 Backend 的 `API_SECRET_KEY` 一致。

  variables:
    - key: PG_USER
      type: STRING
      name: PostgreSQL 用户名
      default: rag_user

    - key: PG_PASSWORD
      type: STRING
      name: PostgreSQL 密码
      description: 留空则自动生成

    - key: PG_DB
      type: STRING
      name: PostgreSQL 数据库名
      default: rag_db

    - key: MINIO_ACCESS_KEY
      type: STRING
      name: MinIO Access Key
      default: minioadmin

    - key: MINIO_SECRET_KEY
      type: STRING
      name: MinIO Secret Key
      description: 留空则自动生成

    - key: API_SECRET_KEY
      type: STRING
      name: API 鉴权密钥
      description: 前端 VITE_API_KEY 必须与此一致
      default: finance-rag-dev-key

  services:
    # ==========================================
    # 1. etcd — Milvus 服务协调
    # ==========================================
    - name: etcd-v2
      template: PREBUILT
      spec:
        source:
          image: quay.io/coreos/etcd:v3.5.5
        ports:
          - id: client
            port: 2379
            type: TCP
        volumes:
          - id: data
            dir: /etcd
        env:
          ETCD_AUTO_COMPACTION_MODE:
            default: revision
          ETCD_AUTO_COMPACTION_RETENTION:
            default: "1000"
          ETCD_QUOTA_BACKEND_BYTES:
            default: "4294967296"
          ETCD_SNAPSHOT_COUNT:
            default: "50000"

    # ==========================================
    # 2. MinIO — Milvus 对象存储
    # ==========================================
    - name: minio-v2
      template: PREBUILT
      spec:
        source:
          image: minio/minio:RELEASE.2023-03-20T20-16-18Z
        ports:
          - id: api
            port: 9000
            type: TCP
        volumes:
          - id: data
            dir: /minio_data
        env:
          MINIO_ACCESS_KEY:
            default: ${MINIO_ACCESS_KEY}
          MINIO_SECRET_KEY:
            default: ${MINIO_SECRET_KEY}

    # ==========================================
    # 3. Milvus 向量数据库
    # ==========================================
    - name: standalone-v2
      template: PREBUILT
      spec:
        source:
          image: milvusdb/milvus:v2.4.0
        ports:
          - id: grpc
            port: 19530
            type: TCP
        volumes:
          - id: data
            dir: /var/lib/milvus
        env:
          ETCD_ENDPOINTS:
            default: etcd-v2:2379
          MINIO_ADDRESS:
            default: minio-v2:9000
        dependencies:
          - etcd-v2
          - minio-v2

    # ==========================================
    # 4. PostgreSQL
    # ==========================================
    - name: postgres
      template: PREBUILT
      spec:
        source:
          image: postgres:15-alpine
        ports:
          - id: database
            port: 5432
            type: TCP
        volumes:
          - id: data
            dir: /var/lib/postgresql/data
        env:
          POSTGRES_USER:
            default: ${PG_USER}
            expose: true
          POSTGRES_PASSWORD:
            default: ${PG_PASSWORD}
            expose: true
          POSTGRES_DB:
            default: ${PG_DB}
            expose: true
